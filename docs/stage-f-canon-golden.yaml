schema: agentready.stage-f-canon-golden.v1
version: '1.0.0'
family: core-canonical
legacy_rule: canonical
crosswalk_class: PARTIAL_OVERLAP
accepted_semantics:
  artifact: agentready.rule-semantics.v2
  version: '1.0.1'
catalog_pin:
  name: agentready.rule-catalog.v2
  version: 2.1.0-draft.2
  digest: d596780a3753733c37164172d4f2ed8e907b89b74f599d4f0025a3144afc5e6f
frozen_rules: [CORE-CANON-002, CORE-CANON-005, CORE-CANON-008]
blocked_rules:
  - rule_id: CORE-CANON-001
    reason: no runtime binding yet — full replacement of legacy `canonical` is BLOCKED
policy_notes:
  block_unknown_escalation: |
    Under failure_policy=block_on_missing_facts an evaluator UNKNOWN verdict is
    escalated to finding status `error` at the finding layer. This is documented
    E0 architecture, not a semantic delta.
classification_vocab:
  - equivalent_overlap
  - intended_split
  - presence_blocked
scenarios:
  - name: self-non-paginated
    canonicals: ['https://example.test/page']
    links: []
    legacy_status: pass
    frozen: {CORE-CANON-002: pass, CORE-CANON-005: pass, CORE-CANON-008: pass}
    classification: equivalent_overlap
  - name: self-paginated
    canonicals: ['https://example.test/page']
    links:
      - {raw_href: /next, resolved_url: 'https://example.test/next', rel: next}
    legacy_status: pass
    frozen: {CORE-CANON-002: pass, CORE-CANON-005: pass, CORE-CANON-008: pass}
    classification: equivalent_overlap
  - name: off-origin-single
    canonicals: ['https://cdn.example.test/canonical']
    links: []
    legacy_status: fail
    frozen: {CORE-CANON-002: fail, CORE-CANON-005: pass, CORE-CANON-008: pass}
    classification: intended_split
    split_note: CORE-CANON-002 owns scheme/host drift; legacy lumps it with strategy
  - name: self-host-other-path-single
    canonicals: ['https://example.test/other']
    links: []
    legacy_status: fail
    frozen: {CORE-CANON-002: pass, CORE-CANON-005: pass, CORE-CANON-008: pass}
    classification: intended_split
    split_note: same-host path drift stays with the paginated-strategy rule family
  - name: paginated-other-final
    canonicals: ['https://example.test/other']
    links:
      - {raw_href: /next, resolved_url: 'https://example.test/next', rel: next}
    legacy_status: fail
    frozen: {CORE-CANON-005: fail, CORE-CANON-008: pass, CORE-CANON-002: pass}
    classification: equivalent_overlap
  - name: paginated-canonical-drift
    canonicals: ['https://example.test/page']
    "final_url": 'https://example.test/other'
    links:
      - {raw_href: /next, resolved_url: 'https://example.test/next', rel: next}
    final_url_override: 'https://example.test/other'
    legacy_status: fail
    frozen: {CORE-CANON-002: pass, CORE-CANON-005: fail, CORE-CANON-008: pass}
    classification: intended_split
    split_note: CORE-CANON-005 owns rel-pagination strategy on drift
  - name: duplicated
    canonicals: ['https://example.test/page', 'https://example.test/other']
    links: []
    legacy_status: fail
    frozen: {CORE-CANON-002: error, CORE-CANON-005: error, CORE-CANON-008: fail}
    classification: presence_blocked
    escalation: block_unknown_escalation
  - name: missing
    canonicals: []
    links: []
    legacy_status: fail
    frozen: {CORE-CANON-002: error, CORE-CANON-005: error, CORE-CANON-008: fail}
    classification: presence_blocked
    escalation: block_unknown_escalation
