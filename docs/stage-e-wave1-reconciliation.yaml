# Stage E wave 1 — executable rule semantics and produced fact payload
# reconciliation matrix (GitHub issue #50, E2-PREP).
#
# Authority model:
#   * Authoritative today = frozen catalog metadata only (title,
#     applicability, fact_requirements, score_role, failure_policy,
#     mechanism, rule_kind, automation_mode) plus repository fact contracts
#     that are actually produced by the shared collection/store/replay path
#     at the accepted base.
#   * POST-GOVERNANCE STATE (#52-#55 accepted): every wave condition is
#     authoritative through the packaged `agentready.rule-semantics.v2`
#     artifact; numeric thresholds are normative there, not in evaluators.
#   * Evidence admissibility rule: a produced value may serve as evaluator
#     input only if it belongs to a fact family DECLARED by that rule's
#     fact_requirements; otherwise a catalog-governance change of the
#     requirements is mandatory before binding.
#   * This matrix changes no catalog bytes: catalog digest below must equal
#     the live snapshot digest (enforced by
#     tests/test_stage_e_wave1_reconciliation.py).
schema: agentready.stage-e-wave1-reconciliation.v1
wave: stage-e-wave-1
accepted_base: 54135bedeedf5b94f731f416c208cd3937214cff
authority:
  catalog_authored_is_authoritative: true
  catalog_authored_fields: [title, applicability, fact_requirements, score_role, failure_policy, mechanism, rule_kind, automation_mode]
  executable_conditions_are_authoritative_via_semantics_artifact: true
  semantics_artifact_is_normative_for_thresholds: true
  binding_requires_accepted_governance_path: true
  declared_family_evidence_rule: true
  acceptance_mechanism: '#52-#55 via agentready.rule-semantics.v2'
  historical_note_pr51_was_not_the_acceptance_mechanism: true
followup_issues:
  gov_canonical: "#52"
  gov_links: "#53"
  gov_google_desc: "#54"
  gov_google_title: "#55"
  fact_transport: "#56"
  fact_projections_resources: "#57"
rule_catalog:
  name: agentready.rule-catalog.v2
  version: 2.1.0-draft.1
  digest: a1507f064f95248d6ee21a1a2123f3b09f4f138012f10d3dd310654a72b62f17
  digest_basis: sha256 over packaged agentready.rule-catalog.v2.yaml bytes
adapter_boundary:
  description: >
    How shared collection objects become evaluation fact envelopes. The
    registry matches envelopes by schema_family/kind; there is exactly one
    adaptation point per produced family and no other emitters exist at the
    accepted base.
  emitters:
    - family: page
      adapter: >
        audit_core.collection page_fact_envelope / load_page_fact_envelopes —
        the sanctioned production constructors adapting replayed collected
        pages (ParsedFacts payloads) into FactEnvelope objects; envelope
        provenance is taken from the persisted Representation record itself
        (representation_id and observed_at; run started_at only as documented
        legacy fallback when a representation carries no observation time),
        with deterministic ids over subject+provenance+payload; verified
        offline by tests/test_page_fact_adapter.py
    - family: robots.fetch|robots.parsed|robots.policy|sitemap.*
      adapter: audit_core.run_facts persist_* helpers writing SiteStore run facts
    - family: representation
      adapter: audit_core.collection replay_collected_pages surfacing SiteStore page records (status_code/content_type) alongside parsed payloads
    - family: transport
      adapter: >
        audit_core.collection transport_fact_envelope / load_transport_fact_envelopes —
        produced per #56 (origin, final_url, persisted redirect chain);
        verified offline by tests/test_transport_projection_adapters.py
    - family: run-projection
      adapter: >
        audit_core.collection run_projection_fact_envelope /
        canonical_projection_fact_envelopes — produced per #57
        (parameter_variants, cross_domain_targets over one run's inventory);
        verified offline by tests/test_transport_projection_adapters.py
  non_emitted_registered_families: [links, resources, structured-data]
produced_fact_contract_at_base:
  page@1:
    fields:
      - titles
      - descriptions
      - headings
      - meta_robots
      - canonicals
      - hreflang
      - base_href
      - lang
      - 'links[] (raw_href, resolved_url, rel, element, anchor_text, source_representation_id, ordinal)'
      - images[]
      - jsonld_markers / jsonld_nodes / jsonld_errors / jsonld_block_count
    persisted_and_replayed: true (SiteStore records + replay_collected_pages)
    evaluation_envelope_adapter: present — page_fact_envelope / load_page_fact_envelopes (production constructors; offline store replay verified)
  representation:
    persisted_and_replayed: true (PageRecord status_code/content_type surfaced through replay)
  links@1:
    producer: NONE — registered in DEFAULT_FACT_SCHEMA_VERSIONS, no envelope emitter exists; resolution is requirement amendment (#52), not production
  transport@1:
    producer: audit_core.collection transport adapter — PRODUCED per #56 (origin of the original request, post-redirect final_url, persisted redirect chain)
    evaluation_envelope_adapter: present — transport_fact_envelope / load_transport_fact_envelopes
    persistence_contract_change_accepted: reconstructed from durable Page/Redirect records at replay instead of separate run-fact rows (#56 deviation recorded 2026-08-22; single source of truth)
  run-projection@1:
    producer: audit_core.collection canonical projection — PRODUCED per #57 (parameter_variants, cross_domain_targets)
    evaluation_envelope_adapter: present — run_projection_fact_envelope / canonical_projection_fact_envelopes
  resources@1:
    producer: NONE — registered, no emitter exists; produce-or-rescope decision recorded via #53/#57 follow-up
  structured-data@1:
    producer: NO standalone envelope — content nested inside page@1 (jsonld_*); requirement decision accepted in #54 (amendment drops the standalone requirement)
  semantics_artifact:
    name: agentready.rule-semantics.v2
    version: '1.0.0'
    role: normative source of accepted executable conditions and requirement amendments for this wave (#52–#55)
    catalog_pin: must equal live snapshot version+digest (enforced by tests/test_rule_semantics.py)
match_status_enum: [MATCH, SEMANTIC_MISMATCH, MISSING_PRODUCED_FIELD, UNGOVERNED_THRESHOLD, BLOCKED]
disposition_enum:
  A: existing contract sufficient
  B: fact-contract change required
  C: rule semantic/catalog governance change required
  D: rule cannot yet be bound
rules:
  - rule_id: CORE-CANON-002
    version: 1.0.0
    module: core-canonical
    catalog_title: "Canonical URL uses the same scheme/host as the audited origin"
    scope: html-page
    applicability_condition: applies whenever a html-page subject was collected for the run
    fact_requirements: [{family: page, min_schema_version: "1"}, {family: links, min_schema_version: "1"}, {family: transport, min_schema_version: "1"}]
    score_role: scored
    failure_policy: block_on_missing_facts
    mechanism: composite_check
    rule_kind: scored_rule
    automation_mode: automated
    authoritative_executable_condition: null
    proposed_executable_condition:
      governance_status: accepted
      accepted_via: agentready.rule-semantics.v2 (governance #52-#55)
      verdicts:
        UNKNOWN: canonical declaration count != 1
        PASS: urlsplit(page.canonicals[0]).scheme and host equal transport.origin scheme/host (case-insensitive host)
        FAIL: otherwise
      evidence_fields: [page.canonicals, transport.origin]
    producers:
      page.canonicals: {producer: collection.ParsedFacts, representation: 'tuple[str]', scoping: document/subject, replayed: true}
      transport.origin: {producer: 'audit_core.collection transport adapter (#56)', representation: payload dict origin/final_url/redirect_chain, scoping: subject/run, replayed: true}
    missing_behavior: block_on_missing_facts -> UNAVAILABLE while required families are unproducible
    match_status: MISSING_PRODUCED_FIELD
    disposition: B
    paths: [C]
    readiness_blocking_families: {links: '#52 amend-away (declared but unused by condition)'}
    disposition_detail: decision uses only declared surfaces; transport@1 needs production (#56) while the unused links@1 requirement must be amended away (#52), otherwise the rule stays UNAVAILABLE after transport production alone
    required_change: amend unused links@1 requirement via #52 (catalog regeneration); switch tests to real producer-shaped payloads
    owning_ref: "#46 correction + #52 + #56"
  - rule_id: CORE-CANON-003
    version: 1.0.0
    module: core-canonical
    catalog_title: "Canonical URL is not blocked by robots directives"
    scope: html-page
    applicability_condition: applies whenever a html-page subject was collected for the run
    fact_requirements: [{family: page, min_schema_version: "1"}]
    score_role: scored
    failure_policy: block_on_missing_facts
    mechanism: atomic_check
    rule_kind: scored_rule
    automation_mode: automated
    authoritative_executable_condition: null
    proposed_executable_condition:
      governance_status: accepted
      accepted_via: agentready.rule-semantics.v2 (governance #52-#55)
      verdicts:
        FAIL: effective directive set contains noindex or none (nofollow excluded — it governs link crawling, not indexation)
        PASS: otherwise
        UNKNOWN: meta_robots unparsable
      evidence_fields: [page.meta_robots]
      open_questions_for_governance: [exact token set, case normalization, combined directives e.g. noindex,follow]
    producers:
      page.meta_robots: {producer: collection.ParsedFacts, representation: 'tuple[str]', scoping: document/subject, replayed: true}
    missing_behavior: block_on_missing_facts -> UNAVAILABLE when page@1 missing
    match_status: SEMANTIC_MISMATCH
    disposition: C
    paths: [C]
    disposition_detail: blocking token set is evaluator-authored and internally inconsistent (docstring claims nofollow, code omits it)
    required_change: accept explicit token-level contract via #52; align implementation and docstrings verbatim
    owning_ref: "#24 correction + #52"
  - rule_id: CORE-CANON-004
    version: 1.0.0
    module: core-canonical
    catalog_title: "Canonical URL does not point to a redirect chain"
    scope: html-page
    applicability_condition: applies whenever a html-page subject was collected for the run
    fact_requirements: [{family: page, min_schema_version: "1"}, {family: links, min_schema_version: "1"}]
    score_role: diagnostic
    failure_policy: unknown_on_missing_facts
    mechanism: composite_check
    rule_kind: diagnostic_rule
    automation_mode: automated
    authoritative_executable_condition: null
    proposed_executable_condition:
      governance_status: accepted
      accepted_via: agentready.rule-semantics.v2 (governance #52-#55)
      verdicts:
        UNKNOWN: canonical count != 1 or transport.redirect_chain unavailable
        FAIL: canonical equals a non-initial hop of transport.redirect_chain
        PASS: otherwise
      evidence_fields: [page.canonicals, transport.redirect_chain]
    producers:
      page.canonicals: {producer: collection.ParsedFacts, representation: 'tuple[str]', scoping: document/subject, replayed: true}
      transport.redirect_chain: {producer: 'audit_core.collection transport adapter (#56)', representation: payload dict origin/final_url/redirect_chain, scoping: subject/run, replayed: true}
    declared_surface_gap: >
      Proposed evidence transport.redirect_chain is NOT part of the declared
      families {page, links}; the earlier draft read it from a links envelope
      that no producer emits. Resolution requires BOTH the transport@1
      fact-contract change (#56) AND a catalog amendment of this rule's
      fact_requirements to {page, transport} via #52. Producing the value
      alone is insufficient.
    non_declared_evidence: {transport.redirect_chain: "#52/#56"}
    readiness_blocking_families: {links: '#52 amend-away (unused by condition)'}
    missing_behavior: unknown_on_missing_facts -> UNKNOWN
    match_status: MISSING_PRODUCED_FIELD
    disposition: C
    paths: [C]
    disposition_detail: redirect history is transport-family evidence; the earlier draft read it from a links envelope that no producer emits
    required_change: '#52 requirement amendment ({page,transport}); evidence read moves off the nonexistent links envelope onto the produced transport adapter'
    owning_ref: "#24 correction + #52 + #56"
  - rule_id: CORE-CANON-005
    version: 1.0.0
    module: core-canonical
    catalog_title: "Self-referencing canonical matches the requested URL for paginated pages"
    scope: html-page
    applicability_condition: applies whenever a html-page subject was collected for the run
    fact_requirements: [{family: page, min_schema_version: "1"}, {family: links, min_schema_version: "1"}, {family: transport, min_schema_version: "1"}]
    score_role: scored
    failure_policy: block_on_missing_facts
    mechanism: composite_check
    rule_kind: scored_rule
    automation_mode: automated
    authoritative_executable_condition: null
    proposed_executable_condition:
      governance_status: accepted
      accepted_via: agentready.rule-semantics.v2 (governance #52-#55)
      verdicts:
        UNKNOWN: canonical count != 1
        NOT_APPLICABLE: no pagination signal observed
        PASS: paginated AND canonical == transport.final_url
        FAIL: paginated AND canonical != transport.final_url
      pagination_signal: lowercase rel tokens of page.links[].rel intersect {next, prev}
      evidence_fields: [page.canonicals, 'page.links[].rel', transport.final_url]
    producers:
      page.canonicals: {producer: collection.ParsedFacts, representation: 'tuple[str]', scoping: document/subject, replayed: true}
      'page.links[].rel': {producer: collection.ParsedFacts LinkOccurrence.rel, representation: per-link string, scoping: document/subject, replayed: true}
      transport.final_url: {producer: 'audit_core.collection transport adapter (#56)', representation: payload dict origin/final_url/redirect_chain, scoping: subject/run, replayed: true}
    missing_behavior: block_on_missing_facts -> UNAVAILABLE while families unproducible
    match_status: MISSING_PRODUCED_FIELD
    disposition: B
    paths: [C]
    readiness_blocking_families: {links: '#52 amend-away (unused by condition)'}
    disposition_detail: pagination signal is derivable from produced page@1 rel; synthetic links.rel_values envelopes are unnecessary; unused links@1 requirement must be amended (#52) or the rule stays UNAVAILABLE after #56 alone
    required_change: '#52 links amendment; re-point evaluator at page.links[].rel'
    owning_ref: "#24 correction + #52 + #56"
  - rule_id: CORE-CANON-006
    version: 1.0.0
    module: core-canonical
    catalog_title: "Canonical URL avoids parameter-only duplicate variants"
    scope: html-page
    applicability_condition: applies whenever a html-page subject was collected for the run
    fact_requirements: [{family: page, min_schema_version: "1"}]
    score_role: observation_only
    failure_policy: unknown_on_missing_facts
    mechanism: atomic_check
    rule_kind: observation_rule
    automation_mode: automated
    authoritative_executable_condition: null
    proposed_executable_condition:
      governance_status: accepted
      accepted_via: agentready.rule-semantics.v2 (governance #52-#55)
      verdicts:
        UNKNOWN: canonical count != 1 or variant inventory unavailable
        FAIL: any observed variant shares canonical scheme+host+path AND has non-empty query
        PASS: otherwise
      evidence_fields: [page.canonicals, run.parameter_variants]
    producers:
      page.canonicals: {producer: collection.ParsedFacts, representation: 'tuple[str]', scoping: document/subject, replayed: true}
      run.parameter_variants: {producer: 'audit_core.collection canonical projection (#57)', representation: payload dict parameter_variants/cross_domain_targets, scoping: run, replayed: true}
    declared_surface_gap: >
      Proposed evidence run.parameter_variants is a run-scoped projection that
      belongs to NO declared family of this rule ({page}). Admissible only
      after a governed versioned surface exists (#57) AND this rule's
      fact_requirements are amended to declare it (#52). Producer addition
      alone is insufficient.
    non_declared_evidence: {run.parameter_variants: "#52/#57"}
    missing_behavior: unknown_on_missing_facts -> UNKNOWN
    match_status: MISSING_PRODUCED_FIELD
    disposition: C
    paths: [C]
    disposition_detail: duplicate variants are a run-scoped inventory view absent from every produced envelope today
    required_change: '#52 requirement amendment + #57 projection surface'
    owning_ref: "#24 correction + #52 + #57"
  - rule_id: CORE-CANON-007
    version: 1.0.0
    module: core-canonical
    catalog_title: "Cross-domain canonical targets are consistent across the crawl"
    scope: html-page
    applicability_condition: applies whenever a html-page subject was collected for the run
    fact_requirements: [{family: page, min_schema_version: "1"}, {family: links, min_schema_version: "1"}]
    score_role: scored
    failure_policy: block_on_missing_facts
    mechanism: composite_check
    rule_kind: scored_rule
    automation_mode: automated
    authoritative_executable_condition: null
    proposed_executable_condition:
      governance_status: accepted
      accepted_via: agentready.rule-semantics.v2 (governance #52-#55)
      verdicts:
        UNKNOWN: canonical count != 1 or projection unavailable
        PASS: canonical on audited origin (trivial consistency)
        FAIL: distinct off-origin canonical target set across subjects has cardinality > 1
      evidence_fields: [page.canonicals, run.cross_domain_targets]
    producers:
      page.canonicals: {producer: collection.ParsedFacts, representation: 'tuple[str]', scoping: document/subject, replayed: true}
      run.cross_domain_targets: {producer: 'audit_core.collection canonical projection (#57)', representation: payload dict parameter_variants/cross_domain_targets, scoping: run, replayed: true}
    declared_surface_gap: >
      Proposed evidence run.cross_domain_targets is a run-scoped projection in
      NO declared family ({page, links}); admissible only after governed
      versioned surface (#57) plus requirement amendment declaring it (#52).
      The earlier draft's links.origin reads were synthetic and are dropped.
    non_declared_evidence: {run.cross_domain_targets: "#52/#57"}
    readiness_blocking_families: {links: '#52 amend-away (unused by condition)'}
    missing_behavior: block_on_missing_facts -> UNAVAILABLE
    match_status: MISSING_PRODUCED_FIELD
    disposition: C
    paths: [C]
    disposition_detail: cross-crawl consistency needs a governed run-scoped target inventory; the draft's links.origin/cross_domain_targets reads were synthetic
    required_change: '#52 requirement amendment + #57 projection surface'
    owning_ref: "#24 correction + #52 + #57"
  - rule_id: CORE-CANON-008
    version: 1.0.0
    module: core-canonical
    catalog_title: "Canonical URL is declared exactly once per page"
    scope: html-page
    applicability_condition: applies whenever a html-page subject was collected for the run
    fact_requirements: [{family: page, min_schema_version: "1"}, {family: links, min_schema_version: "1"}, {family: transport, min_schema_version: "1"}]
    score_role: scored
    failure_policy: block_on_missing_facts
    mechanism: composite_check
    rule_kind: scored_rule
    automation_mode: automated
    authoritative_executable_condition:
      governance_status: catalog_derived
      source: title + scored_rule semantics ("declared exactly once")
      verdicts:
        PASS: len(page.canonicals) == 1
        FAIL: len(page.canonicals) != 1 (zero declarations violate "exactly once")
      evidence_fields: [page.canonicals]
    proposed_executable_condition: null
    producers:
      page.canonicals: {producer: collection.ParsedFacts, representation: 'tuple[str]', scoping: document/subject, replayed: true}
    missing_behavior: block_on_missing_facts applies to missing facts, not to zero declarations
    match_status: MATCH
    disposition: D
    paths: [A-semantics, D-binding, C-readiness]
    binding_readiness: blocked — declared links@1/transport@1 requirements are unproducible although the condition never reads them; Path A cannot be claimed while readiness fails
    readiness_blocking_families: {links: '#52 amend-away (declared but unused)'}
    disposition_detail: semantic MATCH against the catalog-derived condition stands, but the rule cannot reach READY on the normal pipeline, so it stays unbonded; with links still unamended the rule would remain blocked even though transport is now produced — amendment through #52 is required either way
    required_change: resolve readiness by amending the unused links requirement away via #52 (transport is already produced); then Path A applies end-to-end
    owning_ref: "#24 correction + #52 + #56"
  - rule_id: CORE-LINK-001
    version: 1.0.0
    module: core-links
    catalog_title: "Core Links check 001"
    scope: html-page
    applicability_condition: applies whenever a html-page subject was collected for the run
    fact_requirements: [{family: links, min_schema_version: "1"}, {family: page, min_schema_version: "1"}]
    score_role: scored
    failure_policy: block_on_missing_facts
    mechanism: atomic_check
    rule_kind: scored_rule
    automation_mode: automated
    authoritative_executable_condition: null
    proposed_executable_condition:
      governance_status: accepted
      accepted_via: agentready.rule-semantics.v2 (governance #52-#55)
      intent: page exposes resolvable internal hyperlinks
      positive: at least one observed link resolves under subject_origin AND the collected record is an HTML success response
      negative: zero internal-resolvable links while the record is an HTML success response
      indeterminate: HTML-success determination impossible
      evidence_fields: ['page.links[]', representation.status_code, representation.content_type, subject_origin]
      note: counts derived inside the condition from governed page links; no internal_count field introduced
    producers:
      'page.links[]': {producer: collection.ParsedFacts links tuple, representation: sequence of LinkOccurrence, scoping: document/subject, replayed: true}
      representation.status_code: {producer: SiteStore PageRecord surfaced by replay_collected_pages, representation: int|null column, scoping: subject/representation, replayed: true}
      representation.content_type: {producer: SiteStore PageRecord surfaced by replay_collected_pages, representation: str|null column, scoping: subject/representation, replayed: true}
      subject_origin: {producer: AuditRunContext subject identity (not an observation), representation: identity string, scoping: run/subject, replayed: n/a}
    declared_surface_gap: >
      representation.* is not among declared families {links, page};
      whether the HTML-success predicate stays (with requirement amendment)
      or is dropped is decided under #53.
    non_declared_evidence: {representation.status_code: "#53", representation.content_type: "#53"}
    readiness_blocking_families: {links: '#53 decide produce-vs-rescope'}
    missing_behavior: block_on_missing_facts -> UNAVAILABLE while links@1 stays unproducible
    match_status: BLOCKED
    disposition: C
    paths: [C]
    disposition_detail: position-derived semantics make the evaluator normative today; contracts require governance acceptance
    required_change: '#53 accepted contract (+ representation requirement decision); correct implementation verbatim'
    owning_ref: "#27 correction + #53"
  - rule_id: CORE-LINK-002
    version: 1.0.0
    module: core-links
    catalog_title: "Core Links check 002"
    scope: html-page
    applicability_condition: applies whenever a html-page subject was collected for the run
    fact_requirements: [{family: links, min_schema_version: "1"}, {family: page, min_schema_version: "1"}, {family: resources, min_schema_version: "1"}]
    score_role: scored
    failure_policy: block_on_missing_facts
    mechanism: atomic_check
    rule_kind: scored_rule
    automation_mode: automated
    authoritative_executable_condition: null
    proposed_executable_condition:
      governance_status: accepted
      accepted_via: agentready.rule-semantics.v2 (governance #52-#55)
      intent: declared resource URLs referenced by links resolve consistently
      positive: every link whose raw_href matches a declared resource URL resolves to that resource resolved_url
      negative: at least one such link resolves elsewhere; or no link references any declared resource URL
      indeterminate: resources inventory unavailable
      evidence_fields: [resources.inventory, 'page.links[]']
    producers:
      resources.inventory: {producer: 'NONE — production decision recorded in #53/#57 follow-up', representation: absent, scoping: run/subject, replayed: false}
      'page.links[]': {producer: collection.ParsedFacts links tuple, representation: sequence of LinkOccurrence, scoping: document/subject, replayed: true}
    missing_behavior: block_on_missing_facts -> UNAVAILABLE
    match_status: BLOCKED
    disposition: C
    paths: [C]
    readiness_blocking_families: {links: '#53 decide produce-vs-rescope', resources: '#57 decide produce-vs-rescope'}
    disposition_detail: depends on unproducible resources@1 and ungoverned join semantics
    required_change: '#53 accepted contract + #57 resources production decision'
    owning_ref: "#27 correction + #53 + #57"
  - rule_id: CORE-LINK-003
    version: 1.0.0
    module: core-links
    catalog_title: "Core Links check 003"
    scope: html-page
    applicability_condition: applies whenever a html-page subject was collected for the run
    fact_requirements: [{family: links, min_schema_version: "1"}]
    score_role: scored
    failure_policy: block_on_missing_facts
    mechanism: atomic_check
    rule_kind: scored_rule
    automation_mode: automated
    authoritative_executable_condition: null
    proposed_executable_condition:
      governance_status: accepted
      accepted_via: agentready.rule-semantics.v2 (governance #52-#55)
      intent: page declares at least one hyperlink
      positive: len(page.links) >= 1
      negative: len(page.links) == 0 on a parsed HTML document
      indeterminate: none (empty list is decisive)
      evidence_fields: ['page.links[]']
    producers:
      'page.links[]': {producer: collection.ParsedFacts links tuple, representation: sequence of LinkOccurrence, scoping: document/subject, replayed: true}
    declared_surface_gap: condition consumes page@1 while only links@1 is declared; whether to amend requirements or produce links@1 is decided under #53
    non_declared_evidence: {'page.links[]': "#53"}
    readiness_blocking_families: {links: '#53 decide produce-vs-rescope'}
    missing_behavior: block_on_missing_facts -> UNAVAILABLE while links@1 stays unproducible
    match_status: BLOCKED
    disposition: C
    paths: [C]
    disposition_detail: doubly unbondable — position-derived semantics plus unproducible declared family
    required_change: '#53 accepted contract; decide whether consuming page@1 links makes the separate links@1 requirement redundant (amendment)'
    owning_ref: "#27 correction + #53"
  - rule_id: CORE-LINK-004
    version: 1.0.0
    module: core-links
    catalog_title: "Core Links check 004"
    scope: html-page
    applicability_condition: applies whenever a html-page subject was collected for the run
    fact_requirements: [{family: links, min_schema_version: "1"}, {family: page, min_schema_version: "1"}]
    score_role: diagnostic
    failure_policy: unknown_on_missing_facts
