name: Full extra validation

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:
    inputs:
      live_smoke:
        description: "Run the bounded opt-in L4 live smoke"
        required: false
        default: false
        type: boolean
      target:
        description: "Public target for the bounded live smoke"
        required: false
        default: "https://example.com"
        type: string

permissions:
  contents: read

jobs:
  full-extra:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install full extras
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev,mcp,portable]"
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Run full suite without optional skips
        shell: bash
        run: |
          python -m pytest -q -ra 2>&1 | tee pytest-output.txt
          if grep -qE "^[0-9]+ skipped" pytest-output.txt || grep -q "^SKIPPED" pytest-output.txt; then
            echo "Unexpected skipped tests in full-extra run"
            exit 1
          fi

  l4-live-smoke:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.live_smoke == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime
        run: python -m pip install --upgrade pip && python -m pip install .
      - name: Run bounded live smoke
        run: python -m agentready.cli audit "${{ inputs.target }}" --profile quick --max-pages 3 --timeout 5
