name: Full extra validation

on:
  push:
    branches: ["main", "master"]
  pull_request:

permissions:
  contents: read

jobs:
  full-extra:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install full extras
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev,mcp,portable]"
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Run full suite without optional skips
        shell: bash
        run: |
          python -m pytest -q -ra
          if python -m pytest --collect-only -q | grep -q "skipped"; then
            echo "Unexpected skipped tests in full-extra collection"
            exit 1
          fi
