accepted_at: '2026-08-24'
accepted_conditions:
- evidence_fields:
  - page.canonicals
  rule_id: CORE-CANON-001
  source_issue: '#52'
  verdicts:
    FAIL: no canonical URL is declared for the page
    PASS: at least one canonical URL is declared for the page (preferred URL is present);
      declaration uniqueness is owned by CORE-CANON-008 and target validity by the
      remaining canonical rules, so duplicates do not fail this rule (intended_split)
    UNKNOWN: page.canonicals unavailable (blocked fact collection)
  version: 1.0.0
- evidence_fields:
  - page.canonicals
  - transport.origin
  rule_id: CORE-CANON-002
  source_issue: '#52'
  verdicts:
    FAIL: otherwise
    PASS: urlsplit(page.canonicals[0]) scheme/host equals transport.origin scheme/host,
      host case-insensitive
    UNKNOWN: canonical declaration count != 1
  version: 1.0.0
- evidence_fields:
  - page.meta_robots
  rule_id: CORE-CANON-003
  source_issue: '#52'
  verdicts:
    FAIL: effective meta robots directive set contains noindex or none; nofollow does
      not block (it governs link crawling, not indexation)
    PASS: otherwise
    UNKNOWN: meta robots directives unparsable
  version: 1.0.0
- evidence_fields:
  - page.canonicals
  - transport.redirect_chain
  rule_id: CORE-CANON-004
  source_issue: '#52'
  verdicts:
    FAIL: canonical URL equals a non-initial hop of transport.redirect_chain
    PASS: otherwise
    UNKNOWN: canonical count != 1 or transport.redirect_chain unavailable
  version: 1.0.0
- evidence_fields:
  - page.canonicals
  - page.links[].rel
  - transport.final_url
  rule_id: CORE-CANON-005
  source_issue: '#52'
  verdicts:
    FAIL: paginated AND page.canonicals[0] != transport.final_url
    NOT_APPLICABLE: no pagination signal observed (lowercased rel tokens of page.links
      have empty intersection with {next, prev})
    PASS: paginated AND page.canonicals[0] == transport.final_url
    UNKNOWN: canonical count != 1 or transport.final_url unavailable
  version: 1.0.0
- evidence_fields:
  - page.canonicals
  - run-projection.parameter_variants
  rule_id: CORE-CANON-006
  source_issue: '#52'
  verdicts:
    FAIL: some parameter variant shares canonical scheme/host/path and carries a non-empty
      query
    PASS: otherwise
    UNKNOWN: canonical count != 1 or run-projection inventory unavailable
  version: 1.0.0
- evidence_fields:
  - page.canonicals
  - run-projection.cross_domain_targets
  rule_id: CORE-CANON-007
  source_issue: '#52'
  verdicts:
    FAIL: distinct off-origin canonical target cardinality > 1 across the run
    PASS: canonical host equals audited subject host
    UNKNOWN: canonical count != 1 or run-projection inventory unavailable
  version: 1.0.0
- evidence_fields:
  - page.canonicals
  rule_id: CORE-CANON-008
  source_issue: '#52'
  verdicts:
    FAIL: len(page.canonicals) != 1 (zero declarations violate exactly-once)
    PASS: len(page.canonicals) == 1
  version: 1.0.0
- evidence_fields:
  - page.links[]
  - representation.status_code
  - representation.content_type
  - subject_origin
  intent: page exposes resolvable internal hyperlinks
  rule_id: CORE-LINK-001
  source_issue: '#53'
  verdicts:
    FAIL: zero internal-resolvable links while representation is an HTML success response
    PASS: at least one observed link resolves under subject_origin while representation
      is an HTML success response
    UNKNOWN: internal link resolution impossible for the subject
  version: 1.0.0
- evidence_fields:
  - resources.inventory
  - page.links[]
  intent: declared resource URLs referenced by links resolve consistently
  rule_id: CORE-LINK-002
  source_issue: '#53'
  verdicts:
    FAIL: some such link resolves elsewhere, or no link references any declared resource
      URL
    PASS: every link whose raw_href matches a declared resource URL resolves to that
      resource resolved_url
    UNKNOWN: resources inventory unavailable
  version: 1.0.0
- evidence_fields:
  - page.links[]
  intent: page declares at least one hyperlink
  rule_id: CORE-LINK-003
  source_issue: '#53'
  verdicts:
    FAIL: len(page.links) == 0 on a parsed HTML document
    PASS: len(page.links) >= 1
    UNKNOWN: never (an empty list is decisive)
  version: 1.0.0
- evidence_fields:
  - page.links[]
  - representation.status_code
  - representation.content_type
  - subject_origin
  intent: internal link availability diagnostic
  rule_id: CORE-LINK-004
  source_issue: '#53'
  verdicts:
    PASS: internal-resolvable links exist AND representation is an HTML success response
    UNKNOWN: internal link computation impossible
    WARN: otherwise (diagnostic role — never FAIL)
  version: 1.0.0
- evidence_fields:
  - resources.inventory
  - page.links[]
  intent: internal resource orphan detection
  rule_id: CORE-LINK-005
  source_issue: '#53'
  verdicts:
    FAIL: some declared resource is never referenced, or references exist while the
      resources inventory is empty
    PASS: every declared resource URL is referenced by at least one internal link
    UNKNOWN: neither side observable
  version: 1.0.0
- evidence_fields:
  - page.links[]
  - subject_origin
  intent: external link census (observation)
  rule_id: CORE-LINK-006
  source_issue: '#53'
  verdicts:
    FAIL: never applicable
    PASS: always, recording the external-link count derived from governed page links
      resolution (never fails)
    UNKNOWN: link resolution unavailable
  version: 1.0.0
- evidence_fields:
  - page.hreflang
  rule_id: GOOGLE-HREF-001
  source_issue: '#28'
  verdicts:
    FAIL: one or more hreflang annotations use an invalid language code
    PASS: all declared hreflang annotations use a valid BCP47 language code, or no
      annotations present (vacuously valid)
    UNKNOWN: hreflang field unavailable or not a list in page fact
  version: 1.0.0
- defer_reason: Reciprocity requires hreflang observations from other cluster pages;
    {page} does not provide the required cross-page facts.
  deferred: true
  evidence_fields:
  - page.hreflang
  rule_id: GOOGLE-HREF-002
  source_issue: '#28'
  verdicts:
    UNKNOWN: 'deferred: reciprocity requires hreflang observations from other cluster
      pages; {page} does not provide the required cross-page facts'
  version: 1.0.0
- evidence_fields:
  - page.hreflang
  rule_id: GOOGLE-HREF-003
  source_issue: '#28'
  verdicts:
    FAIL: no self-referencing hreflang annotation found
    PASS: at least one hreflang annotation references the current page URL, or no
      annotations present (vacuously valid)
    UNKNOWN: hreflang field unavailable or not a list in page fact
  version: 1.0.0
- evidence_fields:
  - page.hreflang
  rule_id: GOOGLE-HREF-004
  source_issue: '#28'
  verdicts:
    FAIL: no x-default hreflang entry found
    PASS: an x-default hreflang entry is present for language-neutral fallback, or
      no annotations present (vacuously valid)
    UNKNOWN: hreflang field unavailable or not a list in page fact
  version: 1.0.0
- defer_reason: Canonical/indexability of hreflang target URLs requires facts about
    the target pages; {page, links} for the current subject cannot establish those
    properties.
  deferred: true
  evidence_fields:
  - page.hreflang
  - page.canonicals
  - page.meta_robots
  rule_id: GOOGLE-HREF-005
  source_issue: '#28'
  verdicts:
    UNKNOWN: 'deferred: canonical/indexability of hreflang target URLs requires facts
      about the target pages; {page, links} for the current subject cannot establish
      those properties'
  version: 1.0.0
- evidence_fields:
  - page.descriptions
  length_band:
    inclusive: true
    max: 160
    min: 120
  measurement: whitespace-collapsed character length of page.descriptions[0]
  provenance_note: band numbers governed HERE (#54); external guidance prose is background,
    never runtime evidence
  rule_id: GOOGLE-DESC-001
  source_issue: '#54'
  verdicts:
    FAIL_length: collapsed length < 120 (too short) or > 160 (too long)
    FAIL_structural: no description / whitespace-only description / more than one
      distinct non-empty description
    PASS: exactly one non-empty description with 120 <= collapsed-length <= 160 inclusive
    UNKNOWN: page fact unavailable
  version: 1.0.0
- evidence_fields:
  - page.titles
  length_band:
    inclusive: true
    max: 65
    min: 30
  measurement: str.strip() character length of page.titles[0]
  provenance_note: band numbers governed HERE (#55); legacy SEO heuristic prose is
    background, never runtime evidence
  rule_id: GOOGLE-TITLE-001
  source_issue: '#55'
  verdicts:
    FAIL_length: stripped length < 30 (too short) or > 65 (too long)
    FAIL_structural: no title / whitespace-only after strip / more than one non-empty
      title
    PASS: exactly one non-empty title with 30 <= stripped-length <= 65 inclusive
    UNKNOWN: page fact unavailable
  version: 1.0.0
