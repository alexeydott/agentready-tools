[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentready-tools"
version = "0.8.1"
description = "Python website auditor for AI-agent readiness protocols"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "OpenAI-generated implementation"}]
dependencies = [
  "httpx>=0.27,<1",
  "dnspython>=2.6,<3",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
server = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
mcp = ["mcp[cli]>=2,<3"]
google = ["google-auth[requests]>=2.35,<3"]
portable = [
  "pyinstaller>=6.10,<7",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "google-auth[requests]>=2.35,<3",
  "google-analytics-data>=0.18,<1",
  "google-api-python-client>=2,<3",
  "mcp[cli]>=2,<3",
  "playwright>=1.40,<2",
  "openai>=1.60,<2",
  "keyring>=25,<26",
]
analytics = [
  "keyring>=25,<26",
  "google-analytics-data>=0.18,<1",
  "google-api-python-client>=2,<3",
]
ai = [
  "openai>=1.60,<2",
  "keyring>=25,<26",
]
dev = ["pytest>=8,<10"]

[project.scripts]
agentready = "agentready.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
